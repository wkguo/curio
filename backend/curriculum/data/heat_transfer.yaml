  - id: heat_007
    answer_praise: "You picked the ice cube that melts first."
    concept: insulation
    related_concepts: [heat_flow]
    difficulty: 3
    emoji: ice
    prompt: 'Ali wraps one ice cube in a woollen cloth and leaves another ice cube unwrapped on the table. His friend says, "The wrapped one will melt first, because wool is warm." Which ice cube melts first? Explain.'
    answer_patterns: ["unwrapped", "not wrapped", "without (the )?(cloth|wool)", "uncovered"]
    expected_answer: The unwrapped ice cube melts first. Wool is a poor conductor of heat, so it slows down the heat flowing from the warm air into the wrapped ice cube. The wool does not make heat.
    expected_reasoning:
      - id: poor_conductor
        point: Wool is a poor conductor of heat (an insulator).
        patterns: ["poor conductor", "insulat", "trap.{0,15}air"]
      - id: slows_heat_gain
        point: The wool slows heat flowing from the warm air into the wrapped ice cube.
        patterns:
