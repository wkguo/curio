          - "heat.{0,40}(slower|more slowly)"
    required_points: [slows_heat_gain]
    misconceptions: [jacket_makes_heat]
    hints:
      - Does wool make heat, or does it only slow heat down?
      - Where does the heat that melts the ice come from?
    demo_answers:
      misconception: The wrapped ice cube melts first because the wool cloth makes heat and warms it up.
      dialogue: The wool slows down heat from the warm air getting into the ice.
      correct: The unwrapped ice cube melts first. Wool is a poor conductor of heat, so it slows down heat flowing from the warm air into the wrapped ice cube.
